<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sandkit API — SandustryTypes</title>
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Unofficial community Sandkit API reference for Sandustry modding. Not affiliated with Lantto Games or Hooded Horse."
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/core.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/addons/core-dark.min.css"
    />
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="stylesheet" href="assets/site.css" />
    <script src="assets/heading-anchor.js"></script>
    <script src="assets/sidebar-headers.js"></script>
    <script src="assets/search-index.js"></script>
    <script src="assets/search.js"></script>
  </head>
  <body class="loading">
    <div id="app"></div>
    <script>
      (function () {
        var hash = location.hash || "";
        if (hash === "#/api/modules" || hash.indexOf("#/api/modules?") === 0) {
          location.hash = "#/modules";
        } else if (hash === "#/api/full" || hash.indexOf("#/api/full?") === 0) {
          location.hash = "#/full";
        }
      })();
      window.$docsify = {
        name: "Sandustry Types",
        loadSidebar: true,
        subMaxLevel: 0,
        auto2top: true,
        plugins: [
          function (hook) {
            hook.beforeEach(function (content) {
              var path = (window.location.hash || "").replace(/^#/, "").split("?")[0];
              if (path === "/api/modules") {
                window.location.hash = "#/modules";
                return content;
              }
              if (path === "/api/full") {
                window.location.hash = "#/full";
                return content;
              }
              return content;
            });
          },
          window.smtDocsifyHeadingCopyPlugin,
          window.smtDocsifySidebarHeadersPlugin,
          window.smtDocsifySearchPlugin,
        ].filter(function (p) {
          return typeof p === "function";
        }),
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
  </body>
</html>
